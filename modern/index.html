<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bexovar — Modern Refresh (A/B)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../assets/favicon.svg">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="tokens-modern.css">
<link rel="stylesheet" href="ui-kit-modern.css">
<style>
  html, body { background: #f0eee9; margin: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="../ui_kits/website/content.js"></script>
<script src="fx.js"></script>
<script type="text/babel" src="design-canvas.jsx" data-presets="react"></script>
<script type="text/babel" src="components.jsx" data-presets="react"></script>

<script type="text/babel" data-presets="react">
function Frame({ variant, page }) {
  // Renders one scrollable page inside an artboard.
  const ref = React.useRef(null);
  React.useEffect(() => {
    const t = setTimeout(() => window.BexovarModernFX && window.BexovarModernFX.initAll(ref.current), 80);
    return () => clearTimeout(t);
  }, [variant, page]);
  const BX = window.BexovarContent;
  const onBook = () => {};
  const onNav = () => {};
  const pages = {
    home: <ModHome onNav={onNav} onBook={onBook} />,
    services: <ModServices onNav={onNav} onBook={onBook} />,
    demos: <ModDemos onBook={onBook} />,
    "case-studies": <ModCases onBook={onBook} />,
    "how-we-work": <ModHowWeWork onBook={onBook} />,
    about: <ModAbout onBook={onBook} />,
  };
  return (
    <div ref={ref} className={`mod mod-scope ${variant === "gradient" ? "mod--gradient" : "mod--glass"}`} style={{ width: "100%", height: "100%", overflowY: "auto", overflowX: "hidden" }}>
      <ModContainer><ModNav current={page} onNav={onNav} onBook={onBook} /></ModContainer>
      <main>{pages[page] || pages.home}</main>
      <ModContainer><ModFooter onNav={onNav} onBook={onBook} /></ModContainer>
    </div>
  );
}

const PAGES = [
  ["home", "Home"],
  ["services", "Services"],
  ["demos", "Demos"],
  ["case-studies", "Case Studies"],
  ["how-we-work", "How we work"],
  ["about", "About"],
];

function App() {
  return (
    <DesignCanvas>
      <DCSection id="directions" title="Bexovar — Modern Refresh" subtitle="Two Arc/Raycast-flavored directions, same palette + Geist display type. Scroll any artboard to explore; click the expand icon to focus one.">
        <DCArtboard id="a-home" label="A · Glass grid · Home" width={1280} height={900}>
          <Frame variant="glass" page="home" />
        </DCArtboard>
        <DCArtboard id="b-home" label="B · Animated gradient · Home" width={1280} height={900}>
          <Frame variant="gradient" page="home" />
        </DCArtboard>
      </DCSection>

      <DCSection id="services-row" title="Services" subtitle="Same page, two treatments.">
        <DCArtboard id="a-svc" label="A · Services" width={1280} height={900}>
          <Frame variant="glass" page="services" />
        </DCArtboard>
        <DCArtboard id="b-svc" label="B · Services" width={1280} height={900}>
          <Frame variant="gradient" page="services" />
        </DCArtboard>
      </DCSection>

      <DCSection id="demos-row" title="Demos" subtitle="Tilt cards + scroll reveals in both.">
        <DCArtboard id="a-demos" label="A · Demos" width={1280} height={900}>
          <Frame variant="glass" page="demos" />
        </DCArtboard>
        <DCArtboard id="b-demos" label="B · Demos" width={1280} height={900}>
          <Frame variant="gradient" page="demos" />
        </DCArtboard>
      </DCSection>

      <DCSection id="cases-row" title="Case studies">
        <DCArtboard id="a-cases" label="A · Cases" width={1280} height={900}>
          <Frame variant="glass" page="case-studies" />
        </DCArtboard>
        <DCArtboard id="b-cases" label="B · Cases" width={1280} height={900}>
          <Frame variant="gradient" page="case-studies" />
        </DCArtboard>
      </DCSection>

      <DCSection id="hww-row" title="How we work">
        <DCArtboard id="a-hww" label="A · How we work" width={1280} height={900}>
          <Frame variant="glass" page="how-we-work" />
        </DCArtboard>
        <DCArtboard id="b-hww" label="B · How we work" width={1280} height={900}>
          <Frame variant="gradient" page="how-we-work" />
        </DCArtboard>
      </DCSection>

      <DCSection id="about-row" title="About">
        <DCArtboard id="a-about" label="A · About" width={1280} height={900}>
          <Frame variant="glass" page="about" />
        </DCArtboard>
        <DCArtboard id="b-about" label="B · About" width={1280} height={900}>
          <Frame variant="gradient" page="about" />
        </DCArtboard>
      </DCSection>

      <DCPostIt top={120} left={40} rotate={-3}>
        A = quiet glass + grid. B = animated gradient wash. Both share Geist + warm accent.
      </DCPostIt>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
