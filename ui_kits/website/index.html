<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bexovar — UI Kit</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/favicon.svg">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="ui-kit.css">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="content.js"></script>
<script type="text/babel" src="components.jsx" data-presets="react"></script>

<script type="text/babel" data-presets="react">
// Avoid `const { useState } = React` — Babel shares global scope across
// type="text/babel" script blocks and re-declaration crashes the page.

function HomePage({ onNav, onBook }) {
  return (
    <div className="page" data-screen-label="01 Home">
      <Section>
        <div className="hero">
          <div>
            <Eyebrow>{BX.home.hero.eyebrow}</Eyebrow>
            <h1 className="display">{BX.home.hero.title}</h1>
            <p className="lead">{BX.home.hero.body}</p>
            <div className="hero__cta">
              <Button size="lg" onClick={onBook}>Book a call</Button>
              <Button size="lg" variant="secondary" onClick={() => onNav("demos")}>See demos</Button>
            </div>
            <p className="hero__industries">{BX.home.hero.industries}</p>
          </div>
          <OrbitalGraphic />
        </div>
      </Section>

      <Section variant="alt">
        <SectionHeader eyebrow="Proof" title="Real outcomes, real clients" subtitle="Names withheld under NDA. Metrics verified." />
        <div className="grid grid--4" style={{ marginTop: 40 }}>
          {BX.home.metrics.map(m => <StatBlock key={m.industry} tag={m.industry} headline={m.headline} label={m.detail} />)}
        </div>
      </Section>

      <Section>
        <SectionHeader eyebrow="Demos" title="See it in action" subtitle="Short demos of automation we've actually shipped. Want us to run one on your data? Book a call." />
        <div className="grid grid--3" style={{ marginTop: 40 }}>
          {BX.demos.slice(0, 3).map(d => <DemoCard key={d.slug} demo={d} />)}
        </div>
        <p style={{ marginTop: 32, fontSize: 14 }}>
          <a onClick={(e) => { e.preventDefault(); onNav("demos"); }} href="#">Browse full demo gallery →</a>
        </p>
      </Section>

      <Section variant="alt">
        <SectionHeader eyebrow="Services" title="What we build" subtitle="Most engagements blend these. We help you pick the mix." />
        <div className="grid grid--4" style={{ marginTop: 40 }}>
          {BX.services.map(s => <ServiceCard key={s.slug} service={s} onClick={() => onNav("services")} />)}
        </div>
      </Section>

      <Section variant="alt">
        <div className="card card--feature">
          <Eyebrow>{BX.home.featuredCase.eyebrow}</Eyebrow>
          <h2 className="h2" style={{ maxWidth: 760 }}>{BX.home.featuredCase.title}</h2>
          <p className="lead">{BX.home.featuredCase.summary}</p>
          <a onClick={(e) => { e.preventDefault(); onNav("case-studies"); }} href="#" style={{ fontWeight: 600, marginTop: 24, display: "inline-block" }}>{BX.home.featuredCase.cta}</a>
        </div>
      </Section>

      <Section>
        <SectionHeader eyebrow="How we work" title="Predictable process. No mystery." />
        <ol className="grid grid--4" style={{ marginTop: 40, listStyle: "none", padding: 0 }}>
          {BX.home.process.map(s => <ProcessStep key={s.number} step={s} />)}
        </ol>
      </Section>

      <CTASection heading={BX.home.closingCta.heading} subtitle={BX.home.closingCta.subtitle} onBook={onBook} />
    </div>
  );
}

function ServicesPage({ onNav, onBook }) {
  return (
    <div className="page" data-screen-label="02 Services">
      <Section>
        <Eyebrow>What we build</Eyebrow>
        <h1 className="display" style={{ maxWidth: 900 }}>Four services, one outcome: your team gets their time back.</h1>
        <p className="lead">Most of our engagements blend these. We'll help you figure out which mix fits.</p>
      </Section>
      <Section variant="alt">
        <div className="grid grid--2">
          {BX.services.map(s => (
            <div key={s.slug} className="card" style={{ padding: 32 }}>
              <Eyebrow>{s.title}</Eyebrow>
              <h2 className="h3" style={{ fontSize: 26 }}>{s.tagline}</h2>
              <p style={{ fontSize: 15, color: "var(--ink-muted)", marginTop: 12, lineHeight: 1.6 }}>{s.summary}</p>
              <Eyebrow sub>What this looks like in practice</Eyebrow>
              <ul style={{ paddingLeft: 20, color: "var(--ink-muted)", fontSize: 14, margin: "8px 0 0", lineHeight: 1.6 }}>
                {s.examples.map(e => <li key={e} style={{ margin: "6px 0" }}>{e}</li>)}
              </ul>
              <div style={{ marginTop: 20, padding: 16, background: "var(--accent-soft)", borderRadius: 8 }}>
                <div style={{ fontSize: 20, fontWeight: 700, color: "var(--accent)", letterSpacing: "-0.02em" }}>{s.miniCase.headline}</div>
                <div style={{ fontSize: 13, color: "var(--ink-muted)", marginTop: 4 }}>{s.miniCase.summary}</div>
              </div>
            </div>
          ))}
        </div>
      </Section>
      <CTASection heading="Not sure which service you need?" subtitle="Book a call — we'll help you scope it before anyone writes a line of code." onBook={onBook} />
    </div>
  );
}

function DemosPage({ onBook }) {
  const [cat, setCat] = React.useState("All");
  const [playing, setPlaying] = React.useState(null);
  const list = cat === "All" ? BX.demos : BX.demos.filter(d => d.category === cat);
  return (
    <div className="page" data-screen-label="03 Demos">
      <Section>
        <Eyebrow>Demos</Eyebrow>
        <h1 className="display">Demos we've actually shipped.</h1>
        <p className="lead">Short demos across finance, logistics, healthcare, RPA, integrations, and AI agents. Want one on your data? Book a call.</p>
      </Section>
      <Section variant="alt">
        <CategoryFilter categories={BX.demoCategories} active={cat} onChange={setCat} />
        <div className="grid grid--3" style={{ marginTop: 32 }}>
          {list.map(d => <DemoCard key={d.slug} demo={d} onPlay={setPlaying} />)}
        </div>
        {playing && (
          <div onClick={() => setPlaying(null)} style={{ position: "fixed", inset: 0, background: "rgba(15,23,42,0.7)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 24 }}>
            <div style={{ background: "#fff", borderRadius: 16, overflow: "hidden", maxWidth: 800, width: "100%" }} onClick={e => e.stopPropagation()}>
              <div style={{ aspectRatio: "16/9", background: "var(--bg-alt)", display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 16 }}>
                <img src={playing.poster} style={{ width: "100%", height: "100%", position: "absolute" }} />
                <div style={{ position: "relative", zIndex: 1, fontSize: 14, color: "var(--ink-muted)" }}>Demo playback placeholder — video assets ship in Phase 1 production.</div>
              </div>
              <div style={{ padding: 20 }}>
                <div className="demo__meta"><span className="demo__pill">{playing.category}</span><span>{playing.duration}</span></div>
                <h3 className="demo__title">{playing.title}</h3>
                <p className="demo__summary">{playing.summary}</p>
                <Button size="sm" variant="secondary" onClick={() => setPlaying(null)}>Close</Button>
              </div>
            </div>
          </div>
        )}
      </Section>
      <CTASection heading="Want a live demo on your data?" subtitle="30-min call. We'll run one on your actual workflow." onBook={onBook} />
    </div>
  );
}

function CasesPage({ onBook }) {
  const [cat, setCat] = React.useState("All");
  const list = cat === "All" ? BX.cases : BX.cases.filter(c => c.industry === cat);
  return (
    <div className="page" data-screen-label="04 Case Studies">
      <Section>
        <Eyebrow>Case studies</Eyebrow>
        <h1 className="display">The numbers, with the work behind them.</h1>
        <p className="lead">Anonymized engagements that back our headline numbers. Filter by industry to see what we've actually shipped.</p>
      </Section>
      <Section variant="alt">
        <CategoryFilter categories={BX.caseCategories} active={cat} onChange={setCat} />
        <div className="grid grid--2" style={{ marginTop: 32 }}>
          {list.map(c => <CaseCard key={c.slug} c={c} />)}
        </div>
        <div style={{ marginTop: 48 }}>
          <PullQuote quote="We expected a tool. We got a process that runs without us — and the docs to prove it." attribution="VP of Operations, logistics provider" />
        </div>
      </Section>
      <CTASection heading="Your case study could be next." subtitle="Book a call. Bring your messiest process." onBook={onBook} />
    </div>
  );
}

function HowWeWorkPage({ onBook }) {
  const [openFaq, setOpenFaq] = React.useState(0);
  const hww = BX.howWeWork;
  return (
    <div className="page" data-screen-label="05 How We Work">
      <Section>
        <div className="hero">
          <div>
            <Eyebrow>{hww.hero.eyebrow}</Eyebrow>
            <h1 className="display">{hww.hero.title}</h1>
            <p className="lead">{hww.hero.body}</p>
          </div>
          <OrbitalGraphic />
        </div>
      </Section>
      <Section variant="alt">
        <SectionHeader eyebrow="The four phases" title="Same shape every time" />
        <div style={{ display: "grid", gap: 24, marginTop: 40 }}>
          {hww.phases.map(p => <PhasePanel key={p.number} phase={p} />)}
        </div>
      </Section>
      <Section>
        <SectionHeader eyebrow="Why this works" title="What makes this different" />
        <div className="grid grid--3" style={{ marginTop: 40 }}>
          {hww.differentiators.map(d => (
            <div key={d.title} className="card">
              <h3 className="h3">{d.title}</h3>
              <p style={{ fontSize: 14, color: "var(--ink-muted)", marginTop: 12, lineHeight: 1.6 }}>{d.body}</p>
            </div>
          ))}
        </div>
      </Section>
      <Section variant="alt">
        <SectionHeader eyebrow="Questions" title="Things execs usually ask" />
        <div style={{ marginTop: 40, maxWidth: 780 }}>
          {hww.faq.map((f, i) => <FAQItem key={f.q} item={f} open={openFaq === i} onToggle={() => setOpenFaq(openFaq === i ? -1 : i)} />)}
        </div>
      </Section>
      <CTASection heading="Start with a 30-minute call." subtitle="We'll tell you whether your problem fits our shape — honestly — before we quote anything." onBook={onBook} />
    </div>
  );
}

function AboutPage({ onBook }) {
  const a = BX.about;
  return (
    <div className="page" data-screen-label="06 About">
      <Section>
        <Eyebrow>{a.hero.eyebrow}</Eyebrow>
        <h1 className="display" style={{ maxWidth: 900 }}>{a.hero.title}</h1>
        <p className="lead">{a.hero.body}</p>
      </Section>
      <Section variant="alt">
        <SectionHeader eyebrow="Values" title="How we operate" />
        <div className="grid grid--2" style={{ marginTop: 40 }}>
          {a.values.map(v => (
            <div key={v.title} className="card">
              <h3 className="h3">{v.title}</h3>
              <p style={{ fontSize: 15, color: "var(--ink-muted)", marginTop: 12, lineHeight: 1.6 }}>{v.body}</p>
            </div>
          ))}
        </div>
      </Section>
      <Section>
        <SectionHeader eyebrow="By the numbers" title="A bit of context" />
        <div className="grid grid--3" style={{ marginTop: 40 }}>
          {a.stats.map(s => <StatBlock key={s.headline} headline={s.headline} label={s.label} />)}
        </div>
      </Section>
      <CTASection heading="Want to know if we're a fit?" subtitle="Book a 30-min call. If we're not, we'll tell you." onBook={onBook} />
    </div>
  );
}

function BookModal({ open, onClose }) {
  if (!open) return null;
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(15,23,42,0.7)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 60, padding: 24 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: "#fff", borderRadius: 16, padding: 40, maxWidth: 480, width: "100%" }}>
        <Eyebrow>Book a call</Eyebrow>
        <h2 className="h2" style={{ fontSize: 28 }}>30 minutes. No fluff.</h2>
        <p style={{ fontSize: 15, color: "var(--ink-muted)", marginTop: 12, lineHeight: 1.6 }}>This is where a Cal.com embed would load. We'll reply within one business day to confirm.</p>
        <div style={{ display: "grid", gap: 10, marginTop: 20 }}>
          <div className="card" style={{ padding: 14, cursor: "pointer" }}>Tue · 10:00 AM</div>
          <div className="card" style={{ padding: 14, cursor: "pointer" }}>Tue · 2:30 PM</div>
          <div className="card" style={{ padding: 14, cursor: "pointer" }}>Wed · 11:00 AM</div>
        </div>
        <div style={{ display: "flex", gap: 10, marginTop: 24 }}>
          <Button onClick={onClose}>Confirm</Button>
          <Button variant="secondary" onClick={onClose}>Close</Button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [page, setPage] = React.useState(() => localStorage.getItem("bx.page") || "home");
  const [locale, setLocale] = React.useState("en");
  const [book, setBook] = React.useState(false);
  React.useEffect(() => { localStorage.setItem("bx.page", page); window.scrollTo(0, 0); }, [page]);

  const pages = {
    home: <HomePage onNav={setPage} onBook={() => setBook(true)} />,
    services: <ServicesPage onNav={setPage} onBook={() => setBook(true)} />,
    demos: <DemosPage onBook={() => setBook(true)} />,
    "case-studies": <CasesPage onBook={() => setBook(true)} />,
    "how-we-work": <HowWeWorkPage onBook={() => setBook(true)} />,
    about: <AboutPage onBook={() => setBook(true)} />,
  };

  return (
    <React.Fragment>
      <NavBar current={page} onNav={setPage} locale={locale} setLocale={setLocale} onBook={() => setBook(true)} />
      <main>{pages[page] || pages.home}</main>
      <Footer onNav={setPage} onBook={() => setBook(true)} />
      <BookModal open={book} onClose={() => setBook(false)} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
